server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve service names again when Docker recreates a module container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $procurement_backend procurement:80;
    set $operations_backend operations:80;
    set $inventory_backend inventory:80;
    set $budget_backend budget:80;
    set $hr_backend hr:80;
    set $finance_backend finance:80;
    set $mock_api_backend mock-api:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = / {
        return 302 /home/$is_args$args;
    }

    location = /procurement {
        return 308 /procurement/$is_args$args;
    }
    location /procurement/ {
        proxy_pass http://$procurement_backend$request_uri;
    }
    location = /procurement/health {
        proxy_pass http://$procurement_backend/health;
    }

    location = /operations {
        return 308 /operations/$is_args$args;
    }
    location /operations/ {
        proxy_pass http://$operations_backend$request_uri;
    }
    location = /operations/health {
        proxy_pass http://$operations_backend/health;
    }

    location = /inventory {
        return 308 /inventory/$is_args$args;
    }
    location /inventory/ {
        proxy_pass http://$inventory_backend$request_uri;
    }
    location = /inventory/health {
        proxy_pass http://$inventory_backend/health;
    }
    
    location = /budget {
        return 308 /budget/$is_args$args;
    }
    location /budget/ {
        proxy_pass http://$budget_backend$request_uri;
    }
    location = /budget/health {
        proxy_pass http://$budget_backend/health;
    }

    location = /hr {
        return 308 /hr/$is_args$args;
    }
    location /hr/ {
        proxy_pass http://$hr_backend$request_uri;
    }
    location = /hr/health {
        proxy_pass http://$hr_backend/health;
    }

    location = /finance {
        return 308 /finance/$is_args$args;
    }
    location /finance/ {
        proxy_pass http://$finance_backend$request_uri;
    }
    location = /finance/health {
        proxy_pass http://$finance_backend/health;
    }

    location /api/ {
        proxy_pass http://$mock_api_backend$request_uri;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

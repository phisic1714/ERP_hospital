services:
  # quick-tunnel:
  #   image: cloudflare/cloudflared:latest
  #   command: tunnel --url http://gateway:80
  #   restart: unless-stopped
  inventory:
    image: erp-hospital-inventory:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_DIR: apps/inventory
        APP_BASE_PATH: /inventory
    restart: unless-stopped

  procurement:
    image: erp-hospital-procurement:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_DIR: apps/procurement
        APP_BASE_PATH: /procurement
    restart: unless-stopped

  operations:
    image: erp-hospital-operations:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_DIR: apps/operations
        APP_BASE_PATH: /operations
    restart: unless-stopped

  budget:
    image: erp-hospital-budget:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_DIR: apps/budget
        APP_BASE_PATH: /budget
    restart: unless-stopped

  hr:
    image: erp-hospital-hr:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_DIR: apps/hr
        APP_BASE_PATH: /hr
    restart: unless-stopped

  finance:
    image: erp-hospital-finance:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_DIR: apps/finance
        APP_BASE_PATH: /finance
    restart: unless-stopped

  mock-api:
    image: erp-hospital-mock-api:local
    build:
      context: .
      dockerfile: mock-api.Dockerfile
    environment:
      DATABASE_URL: file:/data/mock.db
      MOCK_DATABASE_PATH: /data/mock.db
    volumes:
      - mock-data:/data
    restart: unless-stopped

  gateway:
    image: erp-hospital-gateway:local
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
      args:
        APP_DIR: apps/shell
    ports:
      - "127.0.0.1:${ERP_WEB_PORT:-8080}:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - inventory
      - procurement
      - operations
      - mock-api
      - budget
      - hr
      - finance
    restart: unless-stopped

volumes:
  mock-data:
